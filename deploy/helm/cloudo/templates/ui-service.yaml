apiVersion: v1
kind: Service
metadata:
  name: cloudo-ui
  namespace: {{ include "cloudo.namespace" . }}
  labels:
    {{- include "cloudo.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: ClusterIP
  selector:
    app: cloudo-ui
  ports:
    - name: http
      port: 3000
      targetPort: http
