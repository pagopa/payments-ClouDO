apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: {{ include "cloudo.namespace" . }}
  labels:
    {{- include "cloudo.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  replicas: {{ .Values.orchestrator.replicas }}
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
        {{- include "cloudo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: {{ include "cloudo.orchestratorImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
              name: http
          env:
            - name: AzureWebJobsStorage
              valueFrom:
                secretKeyRef:
                  name: cloudo-secrets
                  key: AzureWebJobsStorage
            - name: CLOUDO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudo-secrets
                  key: CLOUDO_SECRET_KEY
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: cloudo-secrets
                  key: SESSION_SECRET
            - name: APPROVAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: cloudo-secrets
                  key: APPROVAL_SECRET
            - name: SLACK_TOKEN_DEFAULT
              valueFrom:
                secretKeyRef:
                  name: cloudo-secrets
                  key: SLACK_TOKEN_DEFAULT
            - name: SLACK_CHANNEL_DEFAULT
              valueFrom:
                secretKeyRef:
                  name: cloudo-secrets
                  key: SLACK_CHANNEL_DEFAULT
            - name: JSM_API_KEY_DEFAULT
              valueFrom:
                secretKeyRef:
                  name: cloudo-secrets
                  key: JSM_API_KEY_DEFAULT
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudo-secrets
                  key: GITHUB_TOKEN
            - name: NEXTJS_URL
              value: "http://cloudo-ui:3000"
            - name: API_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: cloudo-config
                  key: API_PREFIX
            - name: CLOUDO_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: cloudo-config
                  key: CLOUDO_ENVIRONMENT
            - name: CLOUDO_ENVIRONMENT_SHORT
              valueFrom:
                configMapKeyRef:
                  name: cloudo-config
                  key: CLOUDO_ENVIRONMENT_SHORT
            - name: FEATURE_DEV
              valueFrom:
                configMapKeyRef:
                  name: cloudo-config
                  key: FEATURE_DEV
            - name: GITHUB_REPO
              valueFrom:
                configMapKeyRef:
                  name: cloudo-config
                  key: GITHUB_REPO
            - name: GITHUB_BRANCH
              valueFrom:
                configMapKeyRef:
                  name: cloudo-config
                  key: GITHUB_BRANCH
            - name: GITHUB_PATH_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: cloudo-config
                  key: GITHUB_PATH_PREFIX
            - name: LOGS_BLOB_CONTAINER
              valueFrom:
                configMapKeyRef:
                  name: cloudo-config
                  key: LOGS_BLOB_CONTAINER
            - name: WEBSITES_PORT
              valueFrom:
                configMapKeyRef:
                  name: cloudo-config
                  key: WEBSITES_PORT
            - name: FASTAPI_NOTIFICATION_CONCURRENCY
              valueFrom:
                configMapKeyRef:
                  name: cloudo-config
                  key: FASTAPI_NOTIFICATION_CONCURRENCY
            - name: FASTAPI_NOTIFICATION_BATCH_SIZE
              valueFrom:
                configMapKeyRef:
                  name: cloudo-config
                  key: FASTAPI_NOTIFICATION_BATCH_SIZE
            - name: FASTAPI_NOTIFICATION_VISIBILITY_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: cloudo-config
                  key: FASTAPI_NOTIFICATION_VISIBILITY_TIMEOUT
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.orchestrator.resources | nindent 12 }}
