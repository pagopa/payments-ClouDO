apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudo
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: cloudo.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudo-ui
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: orchestrator
                port:
                  number: 80
