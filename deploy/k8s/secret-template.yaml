apiVersion: v1
kind: Secret
metadata:
  name: cloudo-secrets
type: Opaque
stringData:
  # Azure Storage connection string used by orchestrator/worker.
  AzureWebJobsStorage: "REPLACE_ME"
  # Shared internal key between UI, orchestrator and workers.
  CLOUDO_SECRET_KEY: "REPLACE_ME"
  # Auth/session and approval secrets.
  SESSION_SECRET: "REPLACE_ME"
  APPROVAL_SECRET: "REPLACE_ME"
  # Optional integrations.
  SLACK_TOKEN_DEFAULT: ""
  SLACK_CHANNEL_DEFAULT: "#cloudo-test"
  JSM_API_KEY_DEFAULT: ""
  GITHUB_TOKEN: ""
  GOOGLE_CLIENT_ID: ""
  # Legacy UI compatibility (leave empty if unused).
  FUNCTION_KEY: ""
